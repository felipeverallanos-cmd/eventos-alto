<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registro participantes Afex ETM</title>
<style>
body{font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#f3f5f9;margin:0;padding:20px;color:#1a2340}
.card{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{font-size:22px;margin:0 0 16px}
label{display:block;font-size:14px;margin:12px 0 4px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:12px;font-size:17px;border:1px solid #c8cfdc;border-radius:8px}
button{padding:13px 18px;font-size:16px;border:0;border-radius:8px;cursor:pointer;margin-top:16px}
.p{background:#0047ba;color:#fff;width:100%;font-size:18px}
.s{background:#e4e8f0;color:#1a2340;margin-right:6px}
#ok{color:#0a7a2f;font-weight:600;min-height:22px;margin-top:10px}
#tools{max-width:560px;margin:18px auto 0;text-align:center}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:12px}
td,th{border:1px solid #dde2ea;padding:5px;text-align:left}
#lista{max-width:900px;margin:14px auto;display:none;background:#fff;padding:12px;border-radius:10px}
</style></head><body>
<div class="card">
<h1>Registro participantes Afex EtMDay</h1>
<form id="f" autocomplete="off">
<label>Nombre y apellido *</label><input id="nombre" required>
<label>RUT</label><input id="rut" placeholder="12.345.678-9">
<label>Correo *</label><input id="correo" type="email" required>
<label>Teléfono</label><input id="telefono" type="tel" placeholder="+56 9 ...">
<label>Comuna</label><input id="comuna">
<button class="p" type="submit">Registrarme</button>
<div id="ok"></div>
</form>
</div>
<div id="tools">
<span id="cnt"></span><br>
<button class="s" onclick="descargar()">Descargar Excel (CSV)</button>
<button class="s" onclick="ver()">Ver lista</button>
<button class="s" onclick="borrarUltimo()">Borrar último</button>
</div>
<div id="lista"></div>
<script>
var K='afex_etm_registro';
var C=['fecha','hora','nombre','rut','correo','telefono','comuna'];
function get(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}}
function set(a){localStorage.setItem(K,JSON.stringify(a));cnt()}
function cnt(){document.getElementById('cnt').textContent='Registrados: '+get().length}
document.getElementById('f').onsubmit=function(e){e.preventDefault();
var d=new Date(),r={fecha:d.toLocaleDateString('es-CL'),hora:d.toLocaleTimeString('es-CL')};
C.slice(2).forEach(function(c){r[c]=document.getElementById(c).value.trim()});
var a=get();a.push(r);set(a);this.reset();
var ok=document.getElementById('ok');ok.textContent='Gracias, '+r.nombre+'. Quedaste registrado.';
setTimeout(function(){ok.textContent=''},3000);document.getElementById('nombre').focus();
if(document.getElementById('lista').style.display=='block')ver(true)};
function q(v){v=String(v==null?'':v);return '"'+v.replace(/"/g,'""')+'"'}
function descargar(){var a=get();var s='\ufeff'+C.join(';')+'\r\n'+a.map(function(r){return C.map(function(c){return q(r[c])}).join(';')}).join('\r\n');
var b=new Blob([s],{type:'text/csv;charset=utf-8'});var l=document.createElement('a');
l.href=URL.createObjectURL(b);l.download='registro_afex_etm_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(l);l.click();l.remove()}
function ver(keep){var el=document.getElementById('lista');if(!keep&&el.style.display=='block'){el.style.display='none';return}
var a=get();el.innerHTML='<table><tr>'+C.map(function(c){return'<th>'+c+'</th>'}).join('')+'</tr>'+a.map(function(r){return'<tr>'+C.map(function(c){return'<td>'+String(r[c]||'').replace(/</g,'&lt;')+'</td>'}).join('')+'</tr>'}).join('')+'</table>';el.style.display='block'}
function borrarUltimo(){var a=get();if(!a.length)return;if(confirm('Borrar a '+a[a.length-1].nombre+'?')){a.pop();set(a);ver(true)}}
cnt();
</script></body></html>
